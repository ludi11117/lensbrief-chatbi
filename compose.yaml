services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      LENSBRIEF_DATA: /var/lib/lensbrief
      LENSBRIEF_JWT_SECRET: ${LENSBRIEF_JWT_SECRET:-lensbrief-local-development-only-change-me}
      LENSBRIEF_DRAFT_MODE: ${LENSBRIEF_DRAFT_MODE:-mock}
      LENSBRIEF_PLANNER_MODE: ${LENSBRIEF_PLANNER_MODE:-rules}
      LENSBRIEF_MODEL_URL: ${LENSBRIEF_MODEL_URL:-}
      LENSBRIEF_MODEL: ${LENSBRIEF_MODEL:-}
      LENSBRIEF_MODEL_KEY: ${LENSBRIEF_MODEL_KEY:-}
    volumes:
      - lensbrief-data:/var/lib/lensbrief
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8123/api/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
  web:
    build:
      context: frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LENSBRIEF_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/ && wget -qO /dev/null http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 4s
      retries: 12
volumes:
  lensbrief-data:
